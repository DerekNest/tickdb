name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: test
        run: cargo test --all

  fuzz-smoke:
    name: fuzz smoke (60s/target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + cargo-fuzz
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz varint (60s)
        run: cargo fuzz run fuzz_varint -- -max_total_time=60
        working-directory: fuzz

      - name: Fuzz dod (60s)
        run: cargo fuzz run fuzz_dod -- -max_total_time=60
        working-directory: fuzz

      - name: Fuzz dz (60s)
        run: cargo fuzz run fuzz_dz -- -max_total_time=60
        working-directory: fuzz

      - name: Fuzz rle (60s)
        run: cargo fuzz run fuzz_rle -- -max_total_time=60
        working-directory: fuzz
